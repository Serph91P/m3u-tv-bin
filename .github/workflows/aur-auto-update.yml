name: m3u-tv-bin aur auto update

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:
    inputs:
      package_name:
        description: 'AUR package name to update'
        required: false
        default: 'm3u-tv-bin'
      release_api_url:
        description: 'GitHub API URL for an upstream release object or bounded release list'
        required: false
        default: 'https://api.github.com/repos/m3ue/m3u-tv/releases?per_page=20'
      asset_regex:
        description: 'Regex to select the Linux archive asset and extract version'
        required: false
        default: 'm3u-tv-v(?P<version>[0-9]+\.[0-9]+\.[0-9]+)-linux\.(?P<archive>zip|tar\.gz)$'
      run_build:
        description: 'Run makepkg build and namcap checks'
        required: false
        default: true
        type: boolean
      push:
        description: 'Push PKGBUILD and .SRCINFO to AUR via SSH'
        required: false
        default: true
        type: boolean
      force_publish:
        description: 'Publish to AUR even when upstream metadata did not change'
        required: false
        default: false
        type: boolean

concurrency:
  group: aur-auto-update-m3u-tv-bin
  cancel-in-progress: false

jobs:
  aur_update:
    name: Update and publish AUR package
    runs-on: ubuntu-latest
    container:
      image: archlinux:base-devel@sha256:40d14ac9db5af04f695eacd82a53181ad685fecc2534a66e05a51182a077cbd5
    permissions:
      contents: write

    steps:
      - name: Install toolchain
        run: |
          pacman -Syu --noconfirm --needed --quiet
          pacman -S --noconfirm --needed --quiet \
            base-devel \
            desktop-file-utils \
            git \
            gtk3 \
            hicolor-icon-theme \
            jre-openjdk-headless \
            libepoxy \
            libsecret \
            mpv \
            namcap \
            openssh \
            python
          useradd -m -s /bin/bash aurbuild

      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.ref }}

      - name: Prepare workspace permissions
        run: |
          chown -R aurbuild:aurbuild "$GITHUB_WORKSPACE"
          git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Run unit tests
        run: |
          cd "$GITHUB_WORKSPACE"
          python3 -m unittest discover -s tests -v

      - name: Resolve workflow inputs
        id: resolve
        env:
          INPUT_PACKAGE_NAME: ${{ github.event.inputs.package_name }}
          VARIABLE_PACKAGE_NAME: ${{ vars.AUR_PACKAGE_NAME }}
          INPUT_RELEASE_API_URL: ${{ github.event.inputs.release_api_url }}
          VARIABLE_RELEASE_API_URL: ${{ vars.UPSTREAM_RELEASE_API_URL }}
          INPUT_ASSET_REGEX: ${{ github.event.inputs.asset_regex }}
          VARIABLE_ASSET_REGEX: ${{ vars.UPSTREAM_ASSET_REGEX }}
          INPUT_RUN_BUILD: ${{ github.event.inputs.run_build }}
          INPUT_PUSH: ${{ github.event.inputs.push }}
          INPUT_FORCE_PUBLISH: ${{ github.event.inputs.force_publish }}
        run: |
          validate_package_name() {
            if [[ ! "$1" =~ ^[a-z0-9@_+][a-z0-9@._+-]*$ ]]; then
              echo "Invalid AUR package name: $1" >&2
              exit 1
            fi
          }
          validate_boolean() {
            if [[ "$1" != "true" && "$1" != "false" ]]; then
              echo "Invalid boolean value: $1" >&2
              exit 1
            fi
          }
          validate_single_line() {
            if [[ "$2" == *$'\n'* || "$2" == *$'\r'* ]]; then
              echo "$1 must be a single line" >&2
              exit 1
            fi
          }

          PACKAGE_NAME="$INPUT_PACKAGE_NAME"
          if [ -z "$PACKAGE_NAME" ]; then
            PACKAGE_NAME="$VARIABLE_PACKAGE_NAME"
          fi
          if [ -z "$PACKAGE_NAME" ]; then
            PACKAGE_NAME="m3u-tv-bin"
          fi

          RELEASE_API_URL="$INPUT_RELEASE_API_URL"
          if [ -z "$RELEASE_API_URL" ]; then
            RELEASE_API_URL="$VARIABLE_RELEASE_API_URL"
          fi
          if [ -z "$RELEASE_API_URL" ]; then
            RELEASE_API_URL="https://api.github.com/repos/m3ue/m3u-tv/releases?per_page=20"
          fi

          ASSET_REGEX="$INPUT_ASSET_REGEX"
          if [ -z "$ASSET_REGEX" ]; then
            ASSET_REGEX="$VARIABLE_ASSET_REGEX"
          fi
          if [ -z "$ASSET_REGEX" ]; then
            ASSET_REGEX="m3u-tv-v(?P<version>[0-9]+\\.[0-9]+\\.[0-9]+)-linux\\.(?P<archive>zip|tar\\.gz)$"
          fi

          BUILD="$INPUT_RUN_BUILD"
          if [ -z "$BUILD" ]; then
            BUILD="true"
          fi

          PUSH="$INPUT_PUSH"
          if [ -z "$PUSH" ]; then
            PUSH="true"
          fi

          FORCE_PUBLISH="$INPUT_FORCE_PUBLISH"
          if [ -z "$FORCE_PUBLISH" ]; then
            FORCE_PUBLISH="false"
          fi

          validate_package_name "$PACKAGE_NAME"
          validate_boolean "$BUILD"
          validate_boolean "$PUSH"
          validate_boolean "$FORCE_PUBLISH"
          validate_single_line "release_api_url" "$RELEASE_API_URL"
          validate_single_line "asset_regex" "$ASSET_REGEX"

          printf 'AUR_PACKAGE_NAME=%s\n' "$PACKAGE_NAME" >> "$GITHUB_ENV"
          printf 'UPSTREAM_RELEASE_API_URL=%s\n' "$RELEASE_API_URL" >> "$GITHUB_ENV"
          printf 'UPSTREAM_ASSET_REGEX=%s\n' "$ASSET_REGEX" >> "$GITHUB_ENV"
          printf 'RUN_BUILD=%s\n' "$BUILD" >> "$GITHUB_ENV"
          printf 'PUSH_TO_AUR=%s\n' "$PUSH" >> "$GITHUB_ENV"
          printf 'FORCE_PUBLISH=%s\n' "$FORCE_PUBLISH" >> "$GITHUB_ENV"

      - name: Verify selected branch tip
        run: |
          case "$GITHUB_REF" in
            refs/heads/*) ;;
            *) echo "Refusing to update a non-branch ref: $GITHUB_REF" >&2; exit 1 ;;
          esac
          git fetch --no-tags origin "$GITHUB_REF"
          LOCAL_SHA=$(git rev-parse HEAD)
          REMOTE_SHA=$(git rev-parse FETCH_HEAD)
          if [ "$LOCAL_SHA" != "$REMOTE_SHA" ]; then
            echo "Selected branch advanced during checkout; refusing stale metadata update." >&2
            exit 1
          fi

      - name: Run update script as unprivileged user
        id: update
        run: |
          runuser -u aurbuild --preserve-environment -- bash -lc '
            cd "$GITHUB_WORKSPACE"
            python3 scripts/aur_update.py \
              --json \
              --package-name "$AUR_PACKAGE_NAME" \
              --release-api-url "$UPSTREAM_RELEASE_API_URL" \
              --asset-regex "$UPSTREAM_ASSET_REGEX" > /tmp/aur-update.json
          '
          cat /tmp/aur-update.json

      - name: Parse update result
        id: result
        run: |
          CHANGED=$(python3 -c "import json; payload=json.load(open('/tmp/aur-update.json', 'r', encoding='utf-8')); print('true' if payload.get('changed') else 'false')")
          VERSION=$(python3 -c "import json; payload=json.load(open('/tmp/aur-update.json', 'r', encoding='utf-8')); print(payload.get('new_pkgver'))")
          echo "changed=$CHANGED" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Build and run checks as unprivileged user
        if: ${{ (steps.result.outputs.changed == 'true' || env.FORCE_PUBLISH == 'true' || env.PUSH_TO_AUR == 'true') && env.RUN_BUILD == 'true' }}
        run: |
          runuser -u aurbuild --preserve-environment -- bash -lc '
            set -euo pipefail
            cd "$GITHUB_WORKSPACE/packages/$AUR_PACKAGE_NAME"
            bash -n PKGBUILD
            namcap PKGBUILD || true
            makepkg -s --noconfirm --needed --check
            shopt -s nullglob
            packages=(./*.pkg.tar.*)
            if [ ${#packages[@]} -eq 0 ]; then
              echo "No package artifact was built."
              exit 1
            fi
            namcap "${packages[@]}" || true
          '

      - name: Commit package update back to GitHub
        if: steps.result.outputs.changed == 'true'
        env:
          PACKAGE_VERSION: ${{ steps.result.outputs.version }}
        run: |
          cd "$GITHUB_WORKSPACE"
          git config user.email "actions@github.com"
          git config user.name "AUR Update Bot"
          git add "packages/$AUR_PACKAGE_NAME/PKGBUILD" "packages/$AUR_PACKAGE_NAME/.SRCINFO"
          if git diff --cached --quiet; then
            echo "No GitHub changes to commit."
            exit 0
          fi
          git commit -m "$AUR_PACKAGE_NAME: update to $PACKAGE_VERSION"
          git push origin "HEAD:$GITHUB_REF"

      - name: Push update to AUR
        if: ${{ env.PUSH_TO_AUR == 'true' }}
        env:
          AUR_SSH_KEY: ${{ secrets.AUR_SSH_KEY }}
          AUR_SSH_KNOWN_HOSTS: ${{ secrets.AUR_SSH_KNOWN_HOSTS }}
          PACKAGE_VERSION: ${{ steps.result.outputs.version }}
        run: |
          if [ -z "$AUR_SSH_KEY" ]; then
            echo "Missing AUR_SSH_KEY secret. Skipping AUR push."
            exit 0
          fi
          if [ -z "$AUR_SSH_KNOWN_HOSTS" ]; then
            echo "Missing AUR_SSH_KNOWN_HOSTS secret. Refusing insecure AUR push."
            exit 1
          fi
          cd "$GITHUB_WORKSPACE"
          python3 scripts/publish_aur.py \
            --package-name "$AUR_PACKAGE_NAME" \
            --package-ver "$PACKAGE_VERSION"
